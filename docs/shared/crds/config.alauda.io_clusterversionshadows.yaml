                            type: string
                          targetVersion:
                            description: targetVersion is the desired value at build/progress
                              time.
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    phase:
                      description: phase is the lifecycle status of this stage.
                      enum:
