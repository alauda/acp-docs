---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusterversionshadows.config.alauda.io
spec:
  group: config.alauda.io
  names:
    categories:
    - clusterversion
    kind: ClusterVersionShadow
    listKind: ClusterVersionShadowList
    plural: clusterversionshadows
    shortNames:
    - cvsh
    singular: clusterversionshadow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.current.version
      name: Current
      type: string
    - jsonPath: .status.desired.version
      name: Desired
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Status
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of the cluster upgrade.
            properties:
              capabilities:
                description: capabilities selects the optional capabilities enabled
                  for this cluster.
                properties:
                  additional:
                    description: additional lists capabilities enabled on top of the
                      baseline.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  baseline:
                    description: |-
                      baseline is the capability set to start from, expanded to the
                      capabilities of that version. Defaults to vCurrent when unset.
                    pattern: ^(None|vCurrent|v[0-9]+\.[0-9]+)$
                    type: string
                type: object
              desiredUpdate:
                description: |-
                  desiredUpdate is an optional field that indicates the desired value of
                  the cluster version. Setting this value will trigger an upgrade (if
                  the current version does not match the desired version).
                properties:
                  force:
                    description: |-
                      force allows an administrator to update to an image that has failed
                      checks that are designed to keep the cluster safe.

                      Use only if:
                      * testing
                      * working around a known bug
                    type: boolean
                  image:
                    description: image is a container image reference that contains
                      the update.
                    type: string
                  version:
                    description: version is the container image tag that identifies
                      the update.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of the fields in [image version] must be set
                  rule: '[has(self.image),has(self.version)].filter(x,x==true).size()
                    == 1'
            type: object
          status:
            description: status contains information about cluster upgrade.
            properties:
              availableUpdates:
                description: availableUpdates contains available updates. This list
                  may be
                items:
                  description: Release represents an ACP release image and associated
                    metadata.
                  properties:
                    image:
                      description: |-
                        image is a container image location that contains the update. When this
                        field is part of spec, image is optional if version is specified.
                      minLength: 1
                      type: string
                    version:
                      description: |-
                        version is a semantic version identifying the update version. When this
                        field is part of spec, version is optional if image is specified.
                      minLength: 1
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: at least one of the fields in [image version] must be
                      set
                    rule: '[has(self.image),has(self.version)].filter(x,x==true).size()
                      >= 1'
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              capabilities:
                description: |-
                  capabilities reports which capabilities are currently enabled for
                  this cluster, as opposed to what the spec asked for.

                  The enabled set only grows (ratchet); narrowing the spec does not
                  remove already-enabled capabilities — they appear in implicitlyEnabled.
                properties:
                  enabled:
                    description: |-
                      enabled lists the capabilities in force. Only ever grows: it is the
                      union of previously enabled, spec-selected, and upgrade-carried.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  implicitlyEnabled:
                    description: |-
                      implicitlyEnabled lists enabled capabilities the spec does not
                      currently select — those retained by the ratchet. Makes the
                      difference between spec-selected and ratchet-retained visible.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  known:
                    description: |-
                      known lists every capability the current payload defines. Bounds what
                      enabled and implicitlyEnabled can contain.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              capabilityActivationContext:
                description: |-
                  capabilityActivationContext records the identity (payload, registry,
                  spec generation) a capability activation was committed against, plus
                  the frozen resolved component set. A restart uses it to decide
                  whether the enabled set in capabilities is current or must be
                  recomputed.

                  Written together with capabilities in a single status update.
                  Not a capability-set carrier — capabilities remains the sole record
                  of known/enabled/implicitlyEnabled.
                properties:
                  observedGeneration:
                    description: |-
                      observedGeneration is the metadata.generation the activation was
                      computed against. A restart reuses the frozen set only when this
                      equals the live metadata.generation.
                    format: int64
                    type: integer
                  payloadDigest:
                    description: |-
                      payloadDigest is the immutable digest of the release payload the
                      activation was committed for. A different digest means a different
                      payload; the stored set must not be reused.
                    type: string
                  registryID:
                    description: |-
                      registryID is the capability registry identity
                      (acp-capability-registry/v1@sha256:<64 lowercase hex>) validated at
                      activation. Must equal this binary's compiled registry ID for the
                      frozen set to be reused.
                    pattern: ^acp-capability-registry/v1@sha256:[0-9a-f]{64}$
                    type: string
                  resolvedComponents:
                    description: |-
                      resolvedComponents is the frozen component set the activation
                      resolved, in sorted order with duplicates removed. A restart adopts
                      it instead of resolving again.

                      Must be present and non-empty; a record missing it is malformed and
                      must not be adopted.
                    items:
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - observedGeneration
                - payloadDigest
                - registryID
                - resolvedComponents
                type: object
              conditions:
                description: |-
                  conditions provides information about the cluster version. The condition
                  "Ready" is set to true if the desiredUpdate has been reached. The
                  condition "Reconciling" is set to true if an update is being applied.
                  The condition "Degraded" is set to true if an update is currently blocked
                  by a temporary or permanent error.

                  Conditions are only valid for the current desiredUpdate when
                  metadata.generation is equal to status.generation.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              coreConvergedContext:
                description: |-
                  coreConvergedContext identifies what the CoreConverged condition
                  describes: which release, payload digest, and component set the
                  evaluation covered. Written atomically with the condition.

                  Consumers gating a specific upgrade must compare these values to the
                  expected target — a True left over from a previous target is stale.
                properties:
                  payloadDigest:
                    description: |-
                      payloadDigest is the immutable digest of the release payload the
                      evaluation read.
                    type: string
                  releaseVersion:
                    description: releaseVersion is the desired release the evaluation
                      targeted.
                    type: string
                  resolvedComponents:
                    description: |-
                      resolvedComponents lists, in sorted order, the component names the
                      evaluation covered. Stored as a plain list so consumers can compare
                      directly without a canonical hashing scheme.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              current:
                description: current is the currently applied release version and
                  image of the cluster.
                properties:
                  image:
                    description: |-
                      image is a container image location that contains the update. When this
                      field is part of spec, image is optional if version is specified.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      version is a semantic version identifying the update version. When this
                      field is part of spec, version is optional if image is specified.
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at least one of the fields in [image version] must be set
                  rule: '[has(self.image),has(self.version)].filter(x,x==true).size()
                    >= 1'
              desired:
                description: |-
                  desired is the version that the cluster is reconciling towards.
                  If the cluster is not yet fully initialized, desired will be set
                  with the information available, which may be an image or a tag.
                properties:
                  image:
                    description: |-
                      image is a container image location that contains the update. When this
                      field is part of spec, image is optional if version is specified.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      version is a semantic version identifying the update version. When this
                      field is part of spec, version is optional if image is specified.
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at least one of the fields in [image version] must be set
                  rule: '[has(self.image),has(self.version)].filter(x,x==true).size()
                    >= 1'
              effectiveClusterType:
                description: |-
                  effectiveClusterType is the cluster type this cluster resolved to,
                  and which the component set was computed for. Decided once and
                  recorded; not re-derived on subsequent passes.
                enum:
                - global
                - workload
                type: string
              history:
                description: |-
                  history contains a list of the most recent versions applied to the cluster.
                  This value may be empty during cluster startup, and then will be updated
                  when a new update is being applied. The newest update is first in the
                  list and it is ordered by recency. Updates in the history have state
                  Completed if the rollout completed - if an update was failing or halfway
                  applied the state will be Partial. Only a limited amount of update history
                  is preserved.
                items:
                  description: UpdateHistory is a single attempted update to the cluster.
                  properties:
                    acceptedRisks:
                      description: acceptedRisks records risks which were accepted
                        to initiate the update.
                      type: string
                    completionTime:
                      description: |-
                        completionTime if set, is when the update was fully applied. The update
                        that is currently being applied will have a null completion time.
                        Completion time will always be set for entries that are not the current
                        update (usually to the started time of the next update).
                      format: date-time
                      type: string
                    image:
                      description: |-
                        image is a container image location that contains the update. This value
                        is always populated.
                      minLength: 1
                      type: string
                    startedTime:
                      description: startedTime is the time at which the update was
                        started.
                      format: date-time
                      type: string
                    state:
                      description: |-
                        state reflects whether the update was fully applied. The Partial state
                        indicates the update is not fully applied, while the Completed state
                        indicates the update was successfully rolled out at least once (all
                        parts of the update successfully applied).
                      enum:
                      - Completed
                      - Partial
                      type: string
                    version:
                      description: |-
                        version is a semantic version identifying the update version. If the
                        requested image does not define a version, or if a failure occurs
                        retrieving the image, this value may be empty.
                      type: string
                  required:
                  - image
                  - startedTime
                  - state
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: |-
                  observedGeneration of the object.
                  When this matches the object's metadata.generation, it indicates the status is up-to-date.
                format: int64
                type: integer
              preflight:
                description: |-
                  preflight records information used during an in-progress upgrade to
                  support deterministic preflight reentry behavior.
                properties:
                  checks:
                    description: checks records the latest evaluation result for each
                      preflight check.
                    items:
                      description: PreflightCheckStatus records the latest result
                        of a single preflight check.
                      properties:
                        message:
                          description: message contains human-readable details for
                            the last result.
                          type: string
                        name:
                          description: name is the preflight check name.
                          minLength: 1
                          type: string
                        policy:
                          description: policy indicates how the check behaves on reentry.
                          type: string
                        reason:
                          description: reason is a programmatic identifier for the
                            last result.
                          type: string
                        state:
                          description: state is the latest result state for the check.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  observedAt:
                    description: observedAt is the time when preflight was last evaluated.
                    format: date-time
                    type: string
                type: object
              stages:
                description: |-
                  stages expose the execution stages and per-operation DAG for the current update.
                  Stages are executed sequentially; operations within a stage form a DAG.
                items:
                  properties:
                    name:
                      description: name is the stage display name.
                      minLength: 1
                      type: string
                    operations:
                      description: operations are the DAG nodes in this stage.
                      items:
                        properties:
                          action:
                            description: action is Install/Upgrade/Delete (omit for
                              no-op/unknown).
                            enum:
                            - Install
                            - Upgrade
                            - Delete
                            type: string
                          currentVersion:
                            description: currentVersion is the observed value at build/progress
                              time.
                            type: string
                          dependsOn:
                            description: dependsOn lists direct predecessor operation
                              names within this stage.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                          message:
                            description: |-
                              message is a human-readable explanation of the current phase, written
                              by the CVO (e.g. why the operation is waiting). Empty when there is
                              nothing to explain.
                            type: string
                          moduleInfo:
                            description: moduleInfo is the backing ModuleInfo name
                              (if any).
                            type: string
                          name:
                            description: name is the operation/component identifier
                              (stable ID).
                            minLength: 1
                            type: string
                          phase:
                            description: phase is the current operation phase string
                              (e.g. Running/UpgradePending/Failed).
                            type: string
                          targetVersion:
                            description: targetVersion is the desired value at build/progress
                              time.
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    phase:
                      description: phase is the lifecycle status of this stage.
                      enum:
                      - Pending
                      - Running
                      - Finished
                      type: string
                    priority:
                      description: priority is the stage execution order (ascending).
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
