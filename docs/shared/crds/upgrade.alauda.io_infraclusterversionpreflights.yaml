---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: infraclusterversionpreflights.upgrade.alauda.io
spec:
  group: upgrade.alauda.io
  names:
    kind: InfraClusterVersionPreflight
    listKind: InfraClusterVersionPreflightList
    plural: infraclusterversionpreflights
    shortNames:
    - icvp
    singular: infraclusterversionpreflight
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .spec.kubernetesVersion
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=="Passed")].status
      name: Passed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InfraClusterVersionPreflight is the provider's read-only evaluation of one
          platform upgrade for one cluster, covering every hop before anything
          changes. It holds no lock and is re-evaluated continuously; CVO gates
          setting an InfraClusterVersion's desired state on it.

          There is one per cluster and platform upgrade, named
          <cluster>-<kubernetesVersion>-<8 hex hash> so that the controller and the
          CLI derive the same name for the same upgrade and share one object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              InfraClusterVersionPreflightSpec is the "upgrade to where" part of an
              InfraClusterVersion's spec.desired, plus the cluster's identity.

              It carries no starting version: the provider plans the path from whatever
              the cluster runs when it evaluates, so the result always reflects the
              current state.

              The whole spec is immutable, including whether an optional field is
              present. The object's name is derived from the spec, so a different spec
              under the same name is a conflict to report, never an edit to accept.
            properties:
              clusterName:
                type: string
              components:
                description: |-
                  components are hints only, under the same contract as on
                  InfraClusterVersion.
                items:
                  description: |-
                    ComponentHint is a version hint for one component. It is only a hint:
                    providers must not depend on its presence or value, and CVO does not
                    promise to fill it.
                  properties:
                    name:
                      type: string
                    version:
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              infrastructureRef:
                description: |-
                  InfrastructureReference identifies the CAPI infrastructure cluster kind,
                  copied from Cluster.spec.infrastructureRef. The kind decides which provider
                  handles the object.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                required:
                - apiVersion
                - kind
                type: object
              kubernetesVersion:
                description: |-
                  kubernetesVersion is the final target of this platform upgrade; the
                  provider expands the intermediate versions when it evaluates.
                type: string
              release:
                description: release is the target ACP release of this platform upgrade.
                properties:
                  image:
                    description: image is the digest-pinned release payload, for audit
                      and tracing.
                    type: string
                  version:
                    description: |-
                      version is the target ACP release without a leading v, for example
                      4.3.3, as CVO and the ClusterVersionShadow write it.
                    type: string
                required:
                - version
                type: object
            required:
            - clusterName
            - infrastructureRef
            - kubernetesVersion
            - release
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: |-
              InfraClusterVersionPreflightStatus is written only by the provider, on
              every evaluation.

              A result is fresh only when observedGeneration equals a non-zero
              metadata.generation and observedAt is recent; CVO trusts nothing else.
              resolvedImages and hops are extensions; the rest are core fields every
              provider must implement. All are optional in the schema.
            properties:
              checks:
                items:
                  description: PreflightCheck is one provider-defined check.
                  properties:
                    canBypassCheck:
                      description: |-
                        canBypassCheck says whether a forced upgrade may accept this check's
                        failure as a risk. It only matters for Blocking checks, and absent means
                        false: a check is non-bypassable unless the provider says otherwise,
                        because the rollout it gates cannot be rolled back.
                      type: boolean
                    message:
                      type: string
                    name:
                      description: name is chosen by the provider, in PascalCase.
                      type: string
                    reason:
                      description: reason is PascalCase, for example ImageNotFound.
                      type: string
                    severity:
                      description: PreflightCheckSeverity says whether a failed check
                        blocks the upgrade.
                      enum:
                      - Blocking
                      - Warning
                      type: string
                    state:
                      description: |-
                        PreflightCheckState is the result of the latest evaluation. A check that
                        cannot be evaluated for now is Failed, with the reason saying why.
                      enum:
                      - Passed
                      - Failed
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hops:
                description: |-
                  hops lists the versions the provider plans to pass, in order, with
                  kubernetesVersion only.
                items:
                  description: |-
                    Hop is one Kubernetes version change of at most one minor that the provider
                    performs inside a generation. An InfraClusterVersionPreflight lists hops
                    with kubernetesVersion only.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    kubernetesVersion:
                      type: string
                    phase:
                      description: HopPhase is the progress of one hop.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      type: string
                    startedTime:
                      format: date-time
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              observedAt:
                description: observedAt is when the latest evaluation completed.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              resolvedImages:
                description: |-
                  resolvedImages previews the image each hop will use, one entry per hop
                  and per KubeadmControlPlane or MachineDeployment. CVO does not read it;
                  image problems are reported as checks.
                items:
                  description: |-
                    ResolvedImage is the image one KubeadmControlPlane or MachineDeployment
                    uses for one hop.
                  properties:
                    image:
                      description: |-
                        image is opaque and private to the provider: a VM template name, an ECS
                        image name, an OCI reference, and so on.
                      type: string
                    kubernetesVersion:
                      description: kubernetesVersion is the hop the entry belongs
                        to, intermediate or final.
                      type: string
                    machineTemplateRef:
                      description: |-
                        machineTemplateRef is the MachineTemplate used for the hop. It may be
                        omitted for a hop not yet entered, and on a preflight it is at most the
                        expected name: the template need not exist.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                      type: object
                    targetRef:
                      description: targetRef is the KubeadmControlPlane or a MachineDeployment.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                      type: object
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must start with spec.clusterName
          rule: self.metadata.name.startsWith(self.spec.clusterName + '-')
    served: true
    storage: true
    subresources:
      status: {}
