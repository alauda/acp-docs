---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: infraclusterversions.upgrade.alauda.io
spec:
  group: upgrade.alauda.io
  names:
    kind: InfraClusterVersion
    listKind: InfraClusterVersionList
    plural: infraclusterversions
    shortNames:
    - icv
    singular: infraclusterversion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.infrastructureRef.kind
      name: Provider
      type: string
    - jsonPath: .status.current.kubernetesVersion
      name: Current
      type: string
    - jsonPath: .spec.desired.kubernetesVersion
      name: Desired
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lock.holder
      name: Holder
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InfraClusterVersion is the long-lived desired Kubernetes and OS state of one
          immutable cluster. CVO sets it once per platform upgrade; the cluster's
          provider converges it and reports status.

          There is one per immutable cluster, in the Global cluster's cpaas-system,
          named after the cluster: the API server then guarantees at most one per
          cluster, and a repeated create returns AlreadyExists instead of a duplicate.
          Each generation is one platform upgrade.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InfraClusterVersionSpec is written only by CVO.
            properties:
              clusterName:
                description: |-
                  clusterName is the CAPI Cluster in the same namespace. It equals
                  metadata.name.
                type: string
                x-kubernetes-validations:
                - message: clusterName is immutable
                  rule: self == oldSelf
              desired:
                description: desired is the target of the current platform upgrade.
                properties:
                  components:
                    description: components are hints only; see ComponentHint.
                    items:
                      description: |-
                        ComponentHint is a version hint for one component. It is only a hint:
                        providers must not depend on its presence or value, and CVO does not
                        promise to fill it.
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  kubernetesVersion:
                    description: |-
                      kubernetesVersion is the final target Kubernetes version of this
                      platform upgrade, with the leading v and the suffix, for example
                      v1.34.5-8. The provider decides the intermediate minors on the way.
                    type: string
                  preflightRef:
                    description: |-
                      preflightRef names the InfraClusterVersionPreflight this generation was
                      gated on. CVO always sets it in automatic mode and leaves it empty in
                      manual mode. Providers treat it as informational.
                    properties:
                      name:
                        type: string
                    type: object
                  release:
                    description: release is the target ACP release of this platform
                      upgrade.
                    properties:
                      image:
                        description: image is the digest-pinned release payload, for
                          audit and tracing.
                        type: string
                      version:
                        description: |-
                          version is the target ACP release without a leading v, for example
                          4.3.3, as CVO and the ClusterVersionShadow write it.
                        type: string
                    required:
                    - version
                    type: object
                required:
                - kubernetesVersion
                - release
                type: object
              infrastructureRef:
                description: infrastructureRef is copied from the CAPI Cluster.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                required:
                - apiVersion
                - kind
                type: object
                x-kubernetes-validations:
                - message: infrastructureRef is immutable
                  rule: self == oldSelf
            required:
            - clusterName
            - desired
            - infrastructureRef
            type: object
          status:
            description: |-
              InfraClusterVersionStatus is written only by the provider, and describes the
              generation in observedGeneration.

              Core fields -- observedGeneration, phase, conditions, lock, current,
              startedTime and completionTime -- are what CVO reads and every provider must
              implement. The rest are extensions for observability that CVO does not
              read. All are optional in the schema: CVO creates the object with an empty
              status.
            properties:
              completionTime:
                description: |-
                  completionTime is when the current generation entered Succeeded. It is
                  cleared when a new generation starts.
                format: date-time
                type: string
              components:
                items:
                  description: |-
                    ComponentStatus is informational only: neither CVO nor any component may
                    base a decision on it.
                  properties:
                    action:
                      description: ComponentAction is what the provider did, or will
                        do, for one component.
                      enum:
                      - ImageRollout
                      - InPlace
                      - NoOp
                      - Ignored
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    observedVersion:
                      type: string
                    requestedVersion:
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              current:
                description: |-
                  current is what the cluster has actually reached. kubernetesVersion
                  advances with every completed hop, intermediate minors included;
                  releaseVersion is written only when a whole generation succeeds.
                properties:
                  kubernetesVersion:
                    type: string
                  releaseVersion:
                    description: |-
                      releaseVersion is empty when no release has been recorded, for example
                      on an InfraClusterVersion created during its first platform upgrade.
                    type: string
                type: object
              generationStart:
                description: |-
                  generationStart is the version at the start of the current generation.
                  The history entry appended on success copies it into from: by then
                  current.kubernetesVersion has moved on with every hop.

                  The provider writes it once, when it observes a new generation and
                  moves it to Preparing: kubernetesVersion from the KubeadmControlPlane's
                  spec.version, releaseVersion from current, which is empty on a new
                  object. It does not change it again within the generation -- not across
                  hops, restarts, leader changes or provider upgrades -- and the next
                  generation overwrites it, except a retargeted generation, one in which
                  CVO replaced the target of an unfinished generation: that one keeps it,
                  so it stays the start of the whole platform upgrade. On an object
                  created while the cluster was already mid-upgrade, for example after a
                  disaster-recovery switchover, it is what the provider observed when it
                  took over, which may be an intermediate version. It is for audit only;
                  providers do not decide their next step from it, except that in a
                  retargeted generation they use it to tell this upgrade's own rollouts,
                  those whose spec.version is at or above its kubernetesVersion, from
                  external ones.
                properties:
                  kubernetesVersion:
                    type: string
                  releaseVersion:
                    description: |-
                      releaseVersion is empty when no release has been recorded, for example
                      on an InfraClusterVersion created during its first platform upgrade.
                    type: string
                type: object
              history:
                description: |-
                  history gains one entry per completed generation, oldest first.
                  Providers keep at most 20 entries, dropping the oldest. The schema does
                  not enforce that limit: a cap would reject the provider's write rather
                  than let it trim.
                items:
                  description: |-
                    HistoryEntry records one completed generation, that is one platform
                    upgrade; intermediate hops are not recorded separately.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    from:
                      description: |-
                        from is the version at the start of the generation, copied from
                        status.generationStart.
                      properties:
                        kubernetesVersion:
                          type: string
                        releaseVersion:
                          description: |-
                            releaseVersion is empty when no release has been recorded, for example
                            on an InfraClusterVersion created during its first platform upgrade.
                          type: string
                      type: object
                    holder:
                      type: string
                    startedTime:
                      format: date-time
                      type: string
                    to:
                      description: to is the final version of the generation.
                      properties:
                        kubernetesVersion:
                          type: string
                        releaseVersion:
                          description: |-
                            releaseVersion is empty when no release has been recorded, for example
                            on an InfraClusterVersion created during its first platform upgrade.
                          type: string
                      type: object
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              hops:
                description: |-
                  hops is the path the provider plans to walk, in order. Reset when a new
                  generation starts; empty for a no-op generation.
                items:
                  description: |-
                    Hop is one Kubernetes version change of at most one minor that the provider
                    performs inside a generation. An InfraClusterVersionPreflight lists hops
                    with kubernetesVersion only.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    kubernetesVersion:
                      type: string
                    phase:
                      description: HopPhase is the progress of one hop.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      type: string
                    startedTime:
                      format: date-time
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              lock:
                description: |-
                  LockStatus records which provider is executing the current generation.

                  The cluster is locked while the current generation is unfinished, Stalled
                  included; the lock is released when it succeeds and the record stays for
                  audit until the next generation is taken over. There is no renewal and no
                  time-based takeover.
                properties:
                  acquiredTime:
                    description: |-
                      acquiredTime is when holder was written. Later instances of the same
                      provider do not rewrite it.
                    format: date-time
                    type: string
                  holder:
                    description: |-
                      holder is the provider's stable name, for example
                      cluster-api-provider-dcs, never a pod name. "manual" is reserved for
                      manual mode.
                    type: string
                type: object
              observedGeneration:
                description: |-
                  observedGeneration is the metadata.generation the provider has
                  observed. While it lags, the effective phase is Pending.
                format: int64
                type: integer
              phase:
                description: |-
                  InfraClusterVersionPhase is the raw phase of the generation recorded in
                  status.observedGeneration. There is no Failed or Cancelled: a generation is
                  forward-only and can only progress or stall.

                  The effective phase is Pending whenever observedGeneration lags
                  metadata.generation, whatever this field says; an empty phase also reads as
                  Pending.
                enum:
                - Pending
                - Preparing
                - Progressing
                - Succeeded
                type: string
              resolvedImages:
                description: |-
                  resolvedImages has one entry per hop and per KubeadmControlPlane or
                  MachineDeployment, the same shape as on InfraClusterVersionPreflight.
                items:
                  description: |-
                    ResolvedImage is the image one KubeadmControlPlane or MachineDeployment
                    uses for one hop.
                  properties:
                    image:
                      description: |-
                        image is opaque and private to the provider: a VM template name, an ECS
                        image name, an OCI reference, and so on.
                      type: string
                    kubernetesVersion:
                      description: kubernetesVersion is the hop the entry belongs
                        to, intermediate or final.
                      type: string
                    machineTemplateRef:
                      description: |-
                        machineTemplateRef is the MachineTemplate used for the hop. It may be
                        omitted for a hop not yet entered, and on a preflight it is at most the
                        expected name: the template need not exist.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                      type: object
                    targetRef:
                      description: targetRef is the KubeadmControlPlane or a MachineDeployment.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                      type: object
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              rollout:
                items:
                  description: |-
                    RolloutStatus counts machines for one KubeadmControlPlane or
                    MachineDeployment. There is deliberately no per-machine detail.
                  properties:
                    readyReplicas:
                      format: int32
                      type: integer
                    ref:
                      description: |-
                        TypedLocalReference names an object in the same namespace by kind and name,
                        for example a KubeadmControlPlane, a MachineDeployment or a MachineTemplate.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                      type: object
                    replicas:
                      format: int32
                      type: integer
                    updatedReplicas:
                      format: int32
                      type: integer
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              startedTime:
                description: startedTime is when the current generation entered Preparing.
                format: date-time
                type: string
              steps:
                description: |-
                  steps is the progress inside the current hop. Reset on entering each
                  hop and when a new generation starts.
                items:
                  description: |-
                    Step is one provider-defined step inside the current hop, for example
                    KubeOVN, ControlPlane or Workers/<machinedeployment>.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: StepPhase is the progress of one provider-defined
                        step inside a hop.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Skipped
                      type: string
                    startedTime:
                      format: date-time
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must equal spec.clusterName
          rule: self.metadata.name == self.spec.clusterName
    served: true
    storage: true
    subresources:
      status: {}
