kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  labels:
    cluster.x-k8s.io/v1beta1: v1beta1
  name: baremetalclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: BaremetalCluster
    listKind: BaremetalClusterList
    plural: baremetalclusters
    shortNames:
    - bmc
    singular: baremetalcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.controlPlaneEndpoint.host
      name: Endpoint
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: BaremetalCluster is the Schema for the baremetalclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BaremetalClusterSpec describes the cluster-level infrastructure configuration
              owned by the baremetal provider. See design-doc/api/cr-reference.md §3.
            properties:
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint is the apiserver endpoint exposed to the workload plane.
                  CAPI contract: once set, must not change.
                properties:
                  host:
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - host
                - port
                type: object
              controlPlaneLoadBalancer:
                description: |-
                  ControlPlaneLoadBalancer describes the VIP / LB fronting the control plane.
                  When set, the reconciler backfills ControlPlaneEndpoint from this value.
                properties:
                  host:
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  type:
                    default: Internal
                    enum:
                    - Internal
                    - External
                    type: string
                  vipMode:
                    default: nic
                    description: |-
                      VIPMode controls how alive publishes the internal control-plane VIP.
                      When empty, the provider defaults to nic mode.
                    enum:
                    - nic
                    - arp
                    - policy_route
                    type: string
                  vrid:
                    description: VRID is the keepalived/vrrp identifier used by the
                      internal load balancer.
                    format: int32
                    maximum: 255
                    minimum: 0
                    type: integer
                required:
                - host
                - port
                type: object
              encryptionProviderConfigRef:
                description: |-
                  EncryptionProviderConfigRef references a Secret containing a pre-existing
                  encryption-provider.conf for the cluster. When set, the controller uses
                  this config instead of generating a new random encryption key.
                  Required for disaster recovery: the standby cluster must use the same
                  encryption key as the primary cluster so that restored etcd data can be
                  decrypted by the API server.
                  The referenced Secret must contain a key "encryption-provider.conf".
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              networkDevice:
                description: |-
                  NetworkDevice is the host interface the CNI uses: the tunnel interface in
                  overlay mode, or the interface bridged into the provider network in
                  underlay mode. It is deliberately separate from the interface a node is
                  reached on, so cross-node pod traffic can be moved off the management
                  network.

                  Overlay accepts what kube-ovn accepts for --iface: a name, a
                  comma-separated list, or regular expressions. Underlay requires a single
                  interface name.

                  Empty leaves the choice to kube-ovn in overlay mode, which tunnels over
                  the interface that carries the node IP; underlay has to bridge a named
                  interface and uses eth0. A cluster whose kube-ovn was deployed while
                  empty meant eth0 gets the interface it runs on filled in here, so it
                  stays on it.

                  Changing it after the CNI is deployed rolls kube-ovn's agents in overlay
                  mode; in underlay mode kube-ovn only reads the interface when it first
                  creates the provider network, so the change has to be made there.
                maxLength: 255
                type: string
              networkType:
                description: |-
                  NetworkType identifies the CNI implementation the provider should expect.
                  Phase 1 treats this as metadata only.
                type: string
            type: object
          status:
            description: BaremetalClusterStatus aggregates infra-level readiness for
              CAPI.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureDomains:
                additionalProperties:
                  description: FailureDomainSpec matches the shape of sigs.k8s.io/cluster-api
                    v1beta1.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      type: object
                    controlPlane:
                      type: boolean
                  type: object
                description: FailureDomains is reserved for future Phase 3 work.
                type: object
              ready:
                description: Ready follows the CAPI infrastructure contract (required).
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
