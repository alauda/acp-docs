---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: machineregistrations.elemental.cattle.io
spec:
  group: elemental.cattle.io
  names:
    kind: MachineRegistration
    listKind: MachineRegistrationList
    plural: machineregistrations
    singular: machineregistration
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              config:
                description: Config the cloud config that will be used to provision
                  the node.
                properties:
                  cloud-config:
                    x-kubernetes-preserve-unknown-fields: true
                  elemental:
                    properties:
                      install:
                        properties:
                          config-dir:
                            type: string
                          config-urls:
                            items:
                              type: string
                            type: array
                          debug:
                            type: boolean
                          device:
                            type: string
                          device-selection:
                            description: |-
                              DeviceSelection chooses how the install disk is picked. Empty keeps
                              device and device-selector. "inventory" makes a host booted from the
                              live ISO report its disks on its MachineInventory (status.install) and
                              wait until a person picks one with the
                              baremetal.alauda.io/install-target-device annotation; device and
                              device-selector are not used then.
                            enum:
                            - ""
                            - inventory
                            type: string
                          device-selector:
                            items:
                              description: |-
                                DeviceSelectorRequirement narrows the install candidates. All requirements
                                of a selector must hold, and exactly one disk must remain. Name, ID, WWN,
                                Serial, Model and Transport take In or NotIn; Rotational takes In with
                                "true" or "false"; Size takes Gt or Lt with a quantity.
                              properties:
                                key:
                                  enum:
                                  - Name
                                  - Size
                                  - ID
                                  - WWN
                                  - Serial
                                  - Model
                                  - Transport
                                  - Rotational
                                  type: string
                                operator:
                                  enum:
                                  - In
                                  - NotIn
                                  - Gt
                                  - Lt
                                  type: string
                                values:
                                  items:
                                    type: string
                                  type: array
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                          disable-boot-entry:
                            type: boolean
                          eject-cd:
                            type: boolean
                          firmware:
                            type: string
                          iso:
                            type: string
                          no-format:
                            type: boolean
                          poweroff:
                            type: boolean
                          reboot:
                            type: boolean
                          snapshotter:
                            default:
                              maxSnaps: 2
                              type: loopdevice
                            properties:
                              maxSnaps:
                                default: 2
                                description: MaxSnaps sets the maximum amount of snapshots
                                  to keep
                                minimum: 2
                                type: integer
                              type:
                                default: loopdevice
                                description: Type sets the snapshotter type for a
                                  new installation, available options are 'loopdevice'
                                  and 'btrfs'
                                type: string
                            type: object
                          system-uri:
                            type: string
                          tty:
                            type: string
                        type: object
                      install-registry:
                        description: |-
                          InstallRegistry is the registry mirror the install pulls the system
                          image through. The operator sets it in the configuration that starts
                          an install with a system-uri, from the registry mirror input the
                          MachineRegistration selects with its cpaas.io/registry-reference label
                          (public-registry-credential by default); it is not taken from
                          MachineRegistration.
                        properties:
                          docker-config:
                            description: |-
                              DockerConfig is a dockerconfigjson document with the endpoints'
                              credentials; empty auths for an anonymous mirror.
                            type: string
                          endpoints:
                            description: Endpoints are the real registries, tried
                              in order.
                            items:
                              type: string
                            type: array
                          source:
                            description: Source is the logical registry, cpaas-registry.cpaas-system.
                            type: string
                        required:
                        - endpoints
                        - source
                        type: object
                      install-target:
                        description: |-
                          InstallTarget pins the disk of one install. The operator sets it in the
                          configuration it returns to a host it released for installation; it is
                          not taken from MachineRegistration.
                        properties:
                          device-id:
                            description: |-
                              DeviceID is the canonical ID of the target disk: wwn:…, nvme-eui:…,
                              nvme-nguid:… or serial:…. It takes precedence over install.device and
                              install.device-selector.
                            type: string
                          expect:
                            description: |-
                              Expect lists properties the target must still have; empty fields are
                              not checked.
                            properties:
                              model:
                                type: string
                              serial:
                                type: string
                              size-bytes:
                                format: int64
                                type: integer
                              wwn:
                                type: string
                            type: object
                          wipe-device-ids:
                            description: |-
                              WipeDeviceIDs lists the stale system disks the operator approved for
                              wiping. Unset (null) keeps the default of wiping every stale system disk
                              found. Set, even to an empty list, only the listed disks are wiped and
                              any other stale system disk stops the install. It is a pointer so an
                              empty list survives the YAML round trip to the host.
                            items:
                              type: string
                            type: array
                        type: object
                      registration:
                        description: |-
                          Registration is the registration section of a MachineRegistration. A
                          tpm-mode that contradicts emulate-tpm is rejected at admission; the
                          MachineRegistration controller reports InvalidTPMConfig as well for
                          objects that bypassed it.
                        properties:
                          auth:
                            default: tpm
                            type: string
                          ca-cert:
                            type: string
                          emulate-tpm:
                            type: boolean
                          emulated-tpm-seed:
                            format: int64
                            type: integer
                          no-smbios:
                            type: boolean
                          no-toolkit:
                            type: boolean
                          tpm-mode:
                            description: |-
                              TPMMode selects the TPM behind auth "tpm". "hardware" requires a usable
                              TPM 2.0 device, "emulated" uses the software TPM seeded by
                              emulated-tpm-seed, and "auto" probes the host once at its first
                              registration and keeps the result. The resolved mode is recorded in the
                              registration state and never changes afterwards. Empty keeps the
                              emulate-tpm behaviour. "hardware" and "auto" cannot be combined with
                              emulate-tpm: true. Ignored for other auth methods.
                            enum:
                            - hardware
                            - emulated
                            - auto
                            type: string
                          url:
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: 'tpm-mode hardware or auto cannot be combined with
                            emulate-tpm: true'
                          rule: '!(has(self.tpm__dash__mode) && self.tpm__dash__mode
                            in [''hardware'', ''auto''] && has(self.emulate__dash__tpm)
                            && self.emulate__dash__tpm && (!has(self.auth) || self.auth
                            == ''tpm''))'
                      reset:
                        default:
                          reboot: true
                          reset-oem: true
                          reset-persistent: true
                        properties:
                          config-urls:
                            items:
                              type: string
                            type: array
                          debug:
                            type: boolean
                          disable-boot-entry:
                            type: boolean
                          enabled:
                            type: boolean
                          poweroff:
                            type: boolean
                          reboot:
                            default: true
                            type: boolean
                          reset-oem:
                            default: true
                            type: boolean
                          reset-persistent:
                            default: true
                            type: boolean
                          system-uri:
                            type: string
                        type: object
                      system-agent:
                        properties:
                          ca-cert:
                            type: string
                          secret-name:
                            type: string
                          secret-namespace:
                            type: string
                          strictTLSMode:
                            type: boolean
                          token:
                            type: string
                          url:
                            type: string
                        type: object
                    type: object
                  network:
                    description: NetworkTemplate contains a map of IPAddressPools
                      and a schemaless network config template.
                    properties:
                      config:
                        description: Config contains the network config template (nmc,
                          nmstate, or nmconnections formats)
                        x-kubernetes-preserve-unknown-fields: true
                      configurator:
                        default: none
                        description: Configurator
                        enum:
                        - none
                        - nmc
                        - nmstate
                        - nmconnections
                        type: string
                      ipAddresses:
                        additionalProperties:
                          description: |-
                            TypedLocalObjectReference contains enough information to let you locate the
                            typed referenced object inside the same namespace.
                          properties:
                            apiGroup:
                              description: |-
                                APIGroup is the group for the resource being referenced.
                                If APIGroup is not specified, the specified Kind must be in the core API group.
                                For any other third-party types, APIGroup is required.
                              type: string
                            kind:
                              description: Kind is the type of resource being referenced
                              type: string
                            name:
                              description: Name is the name of resource being referenced
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                          x-kubernetes-map-type: atomic
                        description: IPAddresses contains a map of IPPools references
                        type: object
                    type: object
                type: object
              machineInventoryAnnotations:
                additionalProperties:
                  type: string
                description: MachineInventoryAnnotations annotations to be added to
                  the created MachineInventory object.
                type: object
              machineInventoryLabels:
                additionalProperties:
                  type: string
                description: MachineInventoryLabels label to be added to the created
                  MachineInventory object.
                type: object
              machineName:
                type: string
            type: object
          status:
            properties:
              conditions:
                description: Conditions describe the state of the machine registration
                  object.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              registrationToken:
                description: RegistrationToken a token for registering a machine.
                type: string
              registrationURL:
                description: RegistrationURL is the URL for registering a new machine.
                type: string
              serviceAccountRef:
                description: ServiceAccountRef a reference to the service account
                  created by the machine registration.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
