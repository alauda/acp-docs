                      belongs to.
                    type: string
                  candidates:
                    description: Candidates are the whole disks the live session reported.
                    items:
                      description: InstallCandidate is one whole disk a live session
                        reported.
                      properties:
                        eligible:
                          description: |-
                            Eligible says whether the disk may be chosen as the install target;
                            Reasons explains why not.
                          type: boolean
                        hasData:
                          description: |-
                            HasData lists signatures of data found on the disk, e.g. LVM2_member.
                            Automatic selection never picks such a disk.
                          items:
                            type: string
                          type: array
                        id:
                          description: |-
                            ID is the canonical whole-disk ID: wwn:, nvme-eui:, nvme-nguid: or
