<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">Global cluster installation lifecycle</title>
  <desc id="desc">The bootstrap node creates minialauda, uploads provider packages, applies Cluster API resources, provisions nodes, installs platform components, and hands management to the global cluster.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d" />
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #52606d; stroke-width: 2; rx: 10; }
      .accent { fill: #eef6ff; stroke: #1769aa; }
      .final { fill: #eefbf3; stroke: #16803c; }
      .label { font: 600 17px sans-serif; fill: #1f2933; text-anchor: middle; }
      .detail { font: 14px sans-serif; fill: #52606d; text-anchor: middle; }
      .arrow { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="25" y="90" width="170" height="120" />
  <text class="label" x="110" y="132">Bootstrap node</text>
  <text class="detail" x="110" y="162">Core Package</text>
  <text class="detail" x="110" y="184">local registry</text>

  <rect class="box accent" x="225" y="90" width="170" height="120" />
  <text class="label" x="310" y="132">minialauda</text>
  <text class="detail" x="310" y="162">temporary KIND</text>
  <text class="detail" x="310" y="184">management cluster</text>

  <rect class="box" x="425" y="90" width="170" height="120" />
  <text class="label" x="510" y="132">Provider packages</text>
  <text class="detail" x="510" y="162">package upload</text>
  <text class="detail" x="510" y="184">AppRelease install</text>

  <rect class="box" x="625" y="90" width="170" height="120" />
  <text class="label" x="710" y="132">CAPI resources</text>
  <text class="detail" x="710" y="162">Cluster + provider</text>
  <text class="detail" x="710" y="184">manifests</text>

  <rect class="box" x="825" y="90" width="170" height="120" />
  <text class="label" x="910" y="132">Node provisioning</text>
  <text class="detail" x="910" y="162">VMs or hosts</text>
  <text class="detail" x="910" y="184">kubeadm bootstrap</text>

  <rect class="box" x="1025" y="90" width="170" height="120" />
  <text class="label" x="1110" y="132">Platform install</text>
  <text class="detail" x="1110" y="162">Core components</text>
  <text class="detail" x="1110" y="184">registry and access</text>

  <rect class="box final" x="1225" y="90" width="190" height="120" />
  <text class="label" x="1320" y="132">global handoff</text>
  <text class="detail" x="1320" y="162">resources imported</text>
  <text class="detail" x="1320" y="184">handoff gate passed</text>

  <path class="arrow" d="M195 150 H220" />
  <path class="arrow" d="M395 150 H420" />
  <path class="arrow" d="M595 150 H620" />
  <path class="arrow" d="M795 150 H820" />
  <path class="arrow" d="M995 150 H1020" />
  <path class="arrow" d="M1195 150 H1220" />
</svg>
