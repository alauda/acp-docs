<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">VMware vSphere Cluster API resource dependencies</title>
  <desc id="desc">The Cluster references VSphereCluster and workload controllers. Workload controllers reference VSphereMachineTemplates, which reference machine configuration pools. The controllers create Machines, VSphereMachines, VSphereVMs, and persistent disks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d" />
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #52606d; stroke-width: 2; rx: 10; }
      .root { fill: #eef6ff; stroke: #1769aa; }
      .pool { fill: #fff7e6; stroke: #b7791f; }
      .runtime { fill: #eefbf3; stroke: #16803c; }
      .label { font: 600 17px sans-serif; fill: #1f2933; text-anchor: middle; }
      .detail { font: 14px sans-serif; fill: #52606d; text-anchor: middle; }
      .arrow { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box root" x="510" y="30" width="260" height="70" />
  <text class="label" x="640" y="72">Cluster</text>

  <rect class="box" x="130" y="160" width="260" height="80" />
  <text class="label" x="260" y="195">VSphereCluster</text>
  <text class="detail" x="260" y="218">vCenter + API endpoint</text>

  <rect class="box" x="510" y="160" width="260" height="80" />
  <text class="label" x="640" y="195">KubeadmControlPlane</text>
  <text class="detail" x="640" y="218">control-plane Machines</text>

  <rect class="box" x="890" y="160" width="260" height="80" />
  <text class="label" x="1020" y="195">MachineDeployment</text>
  <text class="detail" x="1020" y="218">worker Machines</text>

  <rect class="box" x="390" y="310" width="260" height="80" />
  <text class="label" x="520" y="345">VSphereMachineTemplate</text>
  <text class="detail" x="520" y="368">control plane</text>

  <rect class="box" x="750" y="310" width="260" height="80" />
  <text class="label" x="880" y="345">VSphereMachineTemplate</text>
  <text class="detail" x="880" y="368">workers</text>

  <rect class="box pool" x="390" y="460" width="260" height="90" />
  <text class="label" x="520" y="495">VSphereMachineConfigPool</text>
  <text class="detail" x="520" y="518">control-plane slots</text>
  <text class="detail" x="520" y="538">IP + persistent disks</text>

  <rect class="box pool" x="750" y="460" width="260" height="90" />
  <text class="label" x="880" y="495">VSphereMachineConfigPool</text>
  <text class="detail" x="880" y="518">worker slots</text>
  <text class="detail" x="880" y="538">IP + persistent disks</text>

  <rect class="box runtime" x="1050" y="430" width="190" height="140" />
  <text class="label" x="1145" y="468">Runtime objects</text>
  <text class="detail" x="1145" y="495">Machine</text>
  <text class="detail" x="1145" y="518">VSphereMachine</text>
  <text class="detail" x="1145" y="541">VSphereVM + VMDKs</text>

  <path class="arrow" d="M570 100 L330 155" />
  <path class="arrow" d="M640 100 V155" />
  <path class="arrow" d="M710 100 L950 155" />
  <path class="arrow" d="M600 240 L550 305" />
  <path class="arrow" d="M980 240 L900 305" />
  <path class="arrow" d="M520 390 V455" />
  <path class="arrow" d="M880 390 V455" />
  <path class="arrow" d="M650 525 H700 V600 H1145 V575" />
  <path class="arrow" d="M1010 505 H1045" />
</svg>
