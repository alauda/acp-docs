apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: doc-build-container-platform
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^(/doc-build)$"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      (
        event == "push" &&
        !last_commit_title.contains("ci skip") && (
          source_branch.matches("^(main|master|release-v?[0-9]+([.][0-9]+)+)$") ||
          target_branch.matches("^(main|master|release-v?[0-9]+([.][0-9]+)+)$")
        )
      )
spec:
  # `tasks` is the budget for all tasks together, not per task — a run whose
  # steps add up past it is cancelled wherever it happens to be, and everything
  # already done is thrown away because `upload-translations` runs last.
  #
  # Sized from immutable-infra-docs on 2026-09-03/04, where 6h cancelled two
  # runs during `auto-translate-ru` after Chinese had already succeeded:
  #   auto-translate-zh   2h06m–2h25m for one attempt, 3h25m–3h34m with retries
  #   auto-translate-ru   still running at 2h25m and 2h30m when the budget ran out
  # so the realistic total is over 8h once either language needs a retry.
  #
  # This is the coarse bound. What stops a genuinely stuck step is the per-task
  # `timeout` in the pipeline body (product-docs-pipeline in docs/engineering/gitops).
  timeouts:
    pipeline: 12h
    tasks: 10h

  params:
    - name: doc-base
      value: container_platform

    # 下面这些变量都是 pac 触发时自动注入的
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ source_branch }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"
    - name: pull-request-target
      value: "{{ target_branch }}"

  # The pipeline body is delivered to this namespace by Argo CD from docs/engineering/gitops
  # (pipelines/product-docs-pipeline). PaC cannot assemble a bare pipelineRef.name for a
  # pipeline that is not inlined here, so the cluster resolver is what references it. A
  # change to the body reaches every site repository with its next run.
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: product-docs-pipeline
      - name: namespace
        value: "{{ target_namespace }}"

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: sc-topolvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 25Gi
    # Cloning the site repository: the docs project's GitHub connector. The volume holds a
    # .gitconfig that sends https://github.com through the connector's proxy, which also
    # reads the private site repositories.
    - name: basic-auth
      csi:
        driver: connectors-csi
        readOnly: true
        volumeAttributes:
          connector.name: github-com
          connector.namespace: docs
          configuration.names: gitconfig
          token.expiration: 30m
    # The translation repositories on code.alauda.io: the docs project's GitLab connector.
    # Download and upload are separate tasks, so each pod gets a fresh 30-minute token.
    - name: gitlab-connector
      csi:
        driver: connectors-csi
        readOnly: true
        volumeAttributes:
          connector.name: code-alauda-io
          connector.namespace: docs
          configuration.names: gitconfig
          token.expiration: 30m

  taskRunTemplate:
    # Reads and writes the Cloudflare project mapping (a ConfigMap) and nothing else in the
    # cluster; defined in docs/engineering/gitops next to the pipeline body.
    serviceAccountName: docs-site-build
    podTemplate:
      # The namespace enforces the restricted Pod Security standard: no task runs as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      # The release notes come from Jira. This cluster reaches jira.alauda.cn only at this
      # address, on another port; JIRA_BASE_URL in the pipeline body names that port.
      hostAliases:
        - ip: "117.50.122.12"
          hostnames:
            - jira.alauda.cn

  taskRunSpecs:
    - pipelineTaskName: build-online-docs-io
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: build-online-docs-cn
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: build-offline-docs
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: build-exports-docs
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: export-docs
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: build-online-docs-russian
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: build-offline-docs-russian
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: build-exports-docs-russian
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi
    - pipelineTaskName: export-docs-russian
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi