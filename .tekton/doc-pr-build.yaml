apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  # acp-docs requires the check "Pipelines as Code CI / doc-pr-build-container-platform" on
  # its stable branches: keep this name as it is.
  name: doc-pr-build-container-platform
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^(/doc-pr-build)$"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      (
        event == "pull_request" && (
          target_branch.matches("^(main|master|release-v?[0-9]+([.][0-9]+)+)$")
        )
      )
spec:
  timeouts:
    pipeline: 1h
    tasks: 1h

  params:
    - name: doc-base
      value: container_platform

    # 下面这些变量都是 pac 触发时自动注入的
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ source_branch }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"
    - name: pull-request-target
      value: "{{ target_branch }}"

  # The pipeline body is delivered to this namespace by Argo CD from docs/engineering/gitops
  # (pipelines/product-docs-pr-pipeline); the cluster resolver references it.
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: product-docs-pr-pipeline
      - name: namespace
        value: "{{ target_namespace }}"

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: sc-topolvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 25Gi
    # Cloning the site repository: the docs project's GitHub connector (private site
    # repositories included).
    - name: basic-auth
      csi:
        driver: connectors-csi
        readOnly: true
        volumeAttributes:
          connector.name: github-com
          connector.namespace: docs
          configuration.names: gitconfig
          token.expiration: 30m

  taskRunTemplate:
    # Reads and writes the Cloudflare project mapping (a ConfigMap) and nothing else in the
    # cluster; defined in docs/engineering/gitops next to the pipeline body.
    serviceAccountName: docs-site-build
    podTemplate:
      # The namespace enforces the restricted Pod Security standard: no task runs as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      # The release notes come from Jira. This cluster reaches jira.alauda.cn only at this
      # address, on another port; JIRA_BASE_URL in the pipeline body names that port.
      hostAliases:
        - ip: "117.50.122.12"
          hostnames:
            - jira.alauda.cn

  taskRunSpecs:
    - pipelineTaskName: build-docs
      computeResources:
        requests:
          cpu: 2
          memory: 6Gi
        limits:
          cpu: 4
          memory: 16Gi